---
- name: Node Down Diagnostics and ServiceNow Update
  hosts: all
  gather_facts: no

  vars:
    snow_instance: "nowlearning-nlinst04461932-2vgbd-0001.lab"
    snow_user: "admin"
    snow_password: "6bHfJQNZcbjf"

  tasks:

    #################################################
    # GET INCIDENT
    #################################################

    - name: Get Node Down Incident
      uri:
        url: "https://{{ snow_instance }}.service-now.com/api/now/table/incident?sysparm_query=short_descriptionLIKENode%20Down%20Alert^active=true"
        method: GET
        user: "{{ snow_user }}"
        password: "{{ snow_password }}"
        force_basic_auth: yes
        validate_certs: no
        return_content: yes
      delegate_to: localhost
      register: incident_data

    - name: Store Incident Details
      set_fact:
        incident_sys_id: "{{ incident_data.json.result[0].sys_id }}"
        incident_number: "{{ incident_data.json.result[0].number }}"
        device_name: "{{ incident_data.json.result[0].short_description | regex_search('R[0-9]+') }}"

    #################################################
    # RUN DIAGNOSTICS
    #################################################

    - name: Run Node Health Checks
      cisco.ios.ios_command:
        commands:
          - show version
          - show memory statistics
          - show processes cpu
          - show ip interface brief
          - show environment power
          - show diagnostic result switch
          - show environment fan
          - show environment temperature
          - show ip route
          - show cdp neighbors detail
          - show spanning-tree summary
      register: node_output

    #################################################
    # BUILD REPORT
    #################################################

    - name: Create Report Content
      set_fact:
        report_content: |
          ======================================
          INCIDENT NUMBER
          ======================================

          {{ incident_number }}

          ======================================
          DEVICE NAME
          ======================================

          {{ device_name }}

          ======================================
          SHOW VERSION
          ======================================

          {{ node_output.stdout[0] }}

          ======================================
          MEMORY
          ======================================

          {{ node_output.stdout[1] }}

          ======================================
          CPU
          ======================================

          {{ node_output.stdout[2] }}

          ======================================
          IP INTERFACE BRIEF
          ======================================

          {{ node_output.stdout[3] }}

          ======================================
          POWER
          ======================================

          {{ node_output.stdout[4] }}

          ======================================
          DIAGNOSTICS
          ======================================

          {{ node_output.stdout[5] }}

          ======================================
          FAN
          ======================================

          {{ node_output.stdout[6] }}

          ======================================
          TEMPERATURE
          ======================================

          {{ node_output.stdout[7] }}

          ======================================
          ROUTING
          ======================================

          {{ node_output.stdout[8] }}

          ======================================
          CDP NEIGHBORS
          ======================================

          {{ node_output.stdout[9] }}

          ======================================
          SPANNING TREE
          ======================================

          {{ node_output.stdout[10] }}

    #################################################
    # DEBUG INCIDENT DETAILS
    #################################################

    - name: Show Incident Details
      debug:
        msg:
          - "Incident Number = {{ incident_number }}"
          - "Incident Sys ID = {{ incident_sys_id }}"

    #################################################
    # UPDATE SERVICENOW
    #################################################

    - name: Update Work Notes and Close Incident
      uri:
        url: "https://{{ snow_instance }}.service-now.com/api/now/table/incident/{{ incident_sys_id }}"
        method: PATCH
        user: "{{ snow_user }}"
        password: "{{ snow_password }}"
        force_basic_auth: yes
        validate_certs: no
        return_content: yes
        headers:
          Content-Type: application/json
          Accept: application/json
        body_format: json
        body:
          work_notes: "{{ report_content }}"
          incident_state: 7
          close_code: "Solved Permanently"
          close_notes: "Node diagnostics completed successfully. Device reachable and diagnostic report attached."
      delegate_to: localhost
      register: update_result

    #################################################
    # SHOW SERVICENOW RESPONSE
    #################################################

    - name: Display ServiceNow Response
      debug:
        var: update_result.json

    - name: Success
      debug:
        msg:
          - "Incident Updated Successfully"
          - "Incident Number: {{ incident_number }}"
          - "Work Notes Updated"
          - "Close Request Sent To ServiceNow"
